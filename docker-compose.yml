services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: posit
      MYSQL_USER: posit
      MYSQL_PASSWORD: positpw
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - posit_mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: posit-app
    depends_on:
      - mysql
    ports:
      - "8081:8080"   # 로컬에서 8081로 접속 (충돌 방지)
    environment:
      SPRING_PROFILES_ACTIVE: docker
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-proxy
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      # 메인 설정 파일 연결
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # [추가] 스위치 파일이 있는 폴더를 통째로 conf.d에 연결
      # 이렇게 해야 나중에 스크립트로 이 안의 파일을 덮어쓸 수 있습니다.
      - ./nginx/service-url.inc:/etc/nginx/conf.d/service-url.inc
    restart: unless-stopped
    networks:
      - app-network

volumes:
  posit_mysql_data:

networks:
  app-network:
    driver: bridge