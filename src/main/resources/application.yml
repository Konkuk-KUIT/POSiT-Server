server:
  port: 8080
  forward-headers-strategy: framework

spring:
  profiles:
    default: local

  jpa:
    hibernate:
      ddl-auto: validate   # create/update 금지 (Flyway로만 관리)
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    s3:
      bucket: ${AWS_BUCKET_NAME}
    region:
      static: ap-northeast-2
      auto: false
    stack:
      auto: false

kakao:
  api:
    key: "27bfae56e107ae13b9fa728ad5496185"
    url: "https://dapi.kakao.com/v2/local/search/address.json"

solapi:
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sms-from: ${SOLAPI_SMS_FROM}