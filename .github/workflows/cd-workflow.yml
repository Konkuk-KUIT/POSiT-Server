name: CD with Gradle and Docker

on:
  push:
    branches:
      - 'dev'
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: ☕️ set up JDK 17        # 프로젝트의 java 버전에 맞추어 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker build & push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -f Dockerfile \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}" \
            .
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: 🚀 deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' # push 에서만 배포하고 PR은 빌드/테스트만 수행
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            set -e
            # TODO: change <YOUR_REPO_DIR> to the folder on EC2 where docker-compose.yml (and .env) live
            cd /home/ec2-user/POSiT-Server

            echo "✅ Docker login (needed for private images)"
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

            echo "🧷 Set image tag for this deploy"
            echo "IMAGE_TAG=${{ github.sha }}" > .env.ci_tag

            echo "🥳 Pulling new app image"
            docker compose --env-file .env --env-file .env.ci_tag pull app

            echo "🌱 Recreating app container only (keep mysql/nginx)"
            docker compose --env-file .env --env-file .env.ci_tag up -d --no-deps app

            echo "📌 Current status"
            docker compose ps
            
            echo "🚮 Cleaning up old images"
            docker image prune -f
