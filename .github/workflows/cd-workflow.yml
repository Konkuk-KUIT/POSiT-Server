name: CD with Gradle and Docker

on:
  push:
    branches:
      - 'dev'
      - 'main'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: ☕️ set up JDK 17        # 프로젝트의 java 버전에 맞추어 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          setting-path: ${{ github.workspace }}

      - name: 👏🏻 grant execute permission for gradlew
        run: chmod +x gradlew

      - name: 🐘 build with Gradle (without test)
        run: ./gradlew clean build -x test --stacktrace

      - name: 🐳 Docker build & push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker build -f Dockerfile \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest" \
            -t "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}" \
            .
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:latest"
          docker push "${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}"

      - name: 🚀 deploy to server
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@master
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          port: ${{ secrets.EC2_PORT }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,DOCKER_IMAGE,GITHUB_SHA
          script: |
            set -e
            cd /home/ec2-user/POSiT-Server

            echo "✅ Sync tracked deploy files (keep .env)"
            git fetch origin
            git reset --hard origin/main

            echo "✅ Docker login"
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

            echo "🧷 Set image tag for this deploy"
            echo "IMAGE_TAG=$GITHUB_SHA" > .env.ci_tag

            echo "🥳 Pull new app image"
            docker compose --env-file .env --env-file .env.ci_tag pull app

            echo "🌱 Recreate app container"
            docker compose --env-file .env --env-file .env.ci_tag up -d --no-deps app

            echo "🔁 Reload nginx (if config changed)"
            docker compose --env-file .env --env-file .env.ci_tag exec -T nginx nginx -s reload || true

            echo "📌 Status"
            docker compose ps

            echo "🚮 Cleanup"
            docker image prune -f