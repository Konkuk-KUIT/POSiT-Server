events {}

http {
  # upstream 블록 삭제함 (변수로 대체)

  # [중요] Docker 내부 DNS 해석기 설정 (변수 사용시 필수)
  resolver 127.0.0.11 valid=5s;

  # [핵심] 아까 만든 스위치 파일을 불러옵니다.
  include /etc/nginx/conf.d/service-url.inc;
  server {
    listen 80;
    server_name posit-dev.p-e.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }
  # 443: 실제 서비스
  server {
    listen 443 ssl;
    server_name posit-dev.p-e.kr;

    ssl_certificate     /etc/letsencrypt/live/posit-dev.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posit-dev.p-e.kr/privkey.pem;

    location / {
      proxy_pass http://$service_host:$service_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  }
}