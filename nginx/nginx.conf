events {}

http {
  # Docker 내부 DNS (컨테이너 이름 해석)
  resolver 127.0.0.11 valid=5s;

  # ✅ app 컨테이너로 프록시 (가장 안전/단순)
  upstream posit_backend {
    server posit-app:8080;
  }

  # 80: 인증서 갱신/발급 + HTTPS 리다이렉트
  server {
    listen 80;
    server_name posit-dev.p-e.kr;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
return 301 https://$host$request_uri;
    }
  }

  # 443: 실제 서비스
  server {
    listen 443 ssl;
    server_name posit-dev.p-e.kr;

    ssl_certificate     /etc/letsencrypt/live/posit-dev.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posit-dev.p-e.kr/privkey.pem;

    location / {
      proxy_pass http://posit_backend;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
